worker_processes auto;

events {
}

http {
  # HTTP 서버 블록
  server {
    listen 80;
    server_name dev.api.koc-erp.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }

  }

  # HTTPS 서버 블록
  server {
    listen 443 ssl;
    server_name dev.api.koc-erp.co.kr;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_certificate /etc/letsencrypt/live/dev.api.koc-erp.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.api.koc-erp.co.kr/privkey.pem;

    client_max_body_size 51M;

    include mime.types;

    location /static {
        alias /vol/static;
    }

    location ~ ^/(api|admin|docs|redoc|openapi|ws|wss) {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 웹소켓 연결을 위한 설정
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;
    }

    location / {
        return 404;
    }
  }
}
